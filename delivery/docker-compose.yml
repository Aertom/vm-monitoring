# Production — images préchargées via `podman load` (voir HOWTO.md).
# Source du delivery/docker-compose.yml généré par package.sh (0.2.1).
# Lancement : podman-compose up -d
# Ports hôte modifiables (utile en rootless où <1024 est interdit) :
#   FRONTEND_PORT=8080 BACKEND_PORT=8081 podman-compose up -d
# Réseau dédié + IP fixe backend : aucun DNS requis (prod sans DNS OK).
services:
  backend:
    image: localhost/vm-monitoring-backend:0.2.1
    networks:
      vmmon:
        ipv4_address: 172.28.99.10
    volumes:
      - ./config.yaml:/config.yaml:ro,z
      - ./hypervisors.yaml:/hypervisors.yaml:ro,z
      # Clé SSH pour la collecte des versions (chemin vu PAR LE CONTENEUR).
      # À décommenter après avoir copié votre clé dans ./id_ed25519 (chmod 600)
      # et renseigné privateKeyPath: "/ssh/key" dans config.yaml.
      # - ./id_ed25519:/ssh/key:ro,z
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    image: localhost/vm-monitoring-frontend:0.2.1
    networks:
      - vmmon
    environment:
      BACKEND_UPSTREAM: 172.28.99.10:8080
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  vmmon:
    ipam:
      config:
        - subnet: 172.28.99.0/24
