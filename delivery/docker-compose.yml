# Production — images préchargées via `podman load` (voir HOWTO.md).
# Généré par package.sh : ne pas éditer ici, modifier packaging/docker-compose.yml.
# Lancement : podman-compose up -d
# Ports hôte modifiables (utile en rootless où <1024 est interdit) :
#   FRONTEND_PORT=8080 BACKEND_PORT=8081 podman-compose up -d
services:
  backend:
    image: localhost/vm-monitoring-backend:0.2.0
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./hypervisors.yaml:/hypervisors.yaml:ro
      # Clé SSH pour la collecte des versions (chemin vu PAR LE CONTENEUR).
      # À décommenter après avoir copié votre clé dans ./id_ed25519 (chmod 600)
      # et renseigné privateKeyPath: "/ssh/key" dans config.yaml.
      # - ./id_ed25519:/ssh/key:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    image: localhost/vm-monitoring-frontend:0.2.0
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
