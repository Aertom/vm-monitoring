# VM Monitoring - Hypervisors Configuration Example
# Copier vers hypervisors.yaml (ignoré par git) et adapter à votre environnement :
#   cp hypervisors.example.yaml hypervisors.yaml
# Schéma attendu par backend/internal/config/config.go (HypervisorsConfig) :
#   esxi[{name,url,username,password,insecure}],
#   nutanix[{name,url,username,password,insecure}],
#   kvm[{name,host,user,port}]
# Fichier optionnel : s'il est absent, la découverte auto est désactivée.

# Hôtes ESXi / vCenter (API REST https://<host>/rest/vcenter/vm)
esxi:
  - name: "esx-01"
    url: "https://192.168.0.10"
    username: "root"
    password: "change-me"
    insecure: true
  - name: "esx-02"
    url: "https://192.168.0.11"
    username: "root"
    password: "change-me"
    insecure: true

# Clusters Nutanix AHV (API Prism https://<host>:9440)
nutanix:
  - name: "ahv-01"
    url: "https://192.168.0.20:9440"
    username: "admin"
    password: "change-me"
    insecure: true

# Hôtes KVM/libvirt (via virsh, local ou SSH)
kvm:
  - name: "kvm-01"
    host: "192.168.0.30"
    user: "qemu"
    port: 22
