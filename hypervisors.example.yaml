# VM Monitoring - Hypervisors Configuration Example
# Copy this file to hypervisors.yaml and adjust to your environment

hypervisors:
  esx-01:
    type: "esxi"
    host: "192.168.0.10"
    port: 22
    username: "root"
    password: "your-password-here"
    # For production, use SSH key authentication or env vars
    # keyfile: "/path/to/private/key"

  esx-02:
    type: "esxi"
    host: "192.168.0.11"
    port: 22
    username: "root"
    password: "your-password-here"

  esx-03:
    type: "esxi"
    host: "192.168.0.12"
    port: 22
    username: "root"
    password: "your-password-here"

  # Example AHV hypervisor (Acropolis Hypervisor)
