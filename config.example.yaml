# VM Monitoring - Configuration Example
# Copier vers config.yaml (ignoré par git) et adapter à votre environnement :
#   cp config.example.yaml config.yaml
# Schéma attendu par backend/internal/config/config.go (Config) :
#   listenAddr, pollIntervalSeconds, ssh{user,privateKeyPath,port,timeoutSeconds},
#   staticVMs[{id,hostname,ip}], appDirs{<famille>: [...]}
# appDirs : dossiers scrutés en SSH par famille de VM pour les versions
# (nom de dossier "appli1_1.2.3" -> appli "appli1" version "1.2.3").
# Famille absente ou vide = ["/opt"].

listenAddr: ":8080"
pollIntervalSeconds: 60

ssh:
  user: "monitor"
  privateKeyPath: "/home/monitor/.ssh/id_ed25519"
  port: 22
  timeoutSeconds: 5

# Dossiers scrutés par famille (toutes les familles configurables ici)
appDirs:
  sm: ["/opt"]
  cm: ["/opt", "/appli"]
  ws: ["/opt"]
  oa: ["/opt"]
  unknown: ["/opt"]

# Familles de VMs (détection par sous-chaîne insensible à la casse, dans
# l'ordre listé ; shared: true = rôle partagé façon oa, exclue de l'ID).
# Décommentez pour renommer, ex. ws -> wks (alignez aussi appDirs et les
# hostnames) :
# families:
#   - name: sm
#   - name: cm
#   - name: wks
#     match: [wks]
#   - name: oa
#     shared: true

staticVMs:
  # Storage/Memory Nodes (sm)
  - id: "vm-sm-01"
    hostname: "sm-prod-01"
    ip: "192.168.1.10"
  - id: "vm-sm-02"
    hostname: "sm-prod-02"
    ip: "192.168.1.11"

  # Compute Nodes (cm) — 4 produits suivis dans /opt et /appli
  - id: "vm-cm-01"
    hostname: "cm-prod-01"
    ip: "192.168.1.20"
  - id: "vm-cm-02"
    hostname: "cm-prod-02"
    ip: "192.168.1.21"

  # Workstations (ws)
  - id: "vm-ws-01"
    hostname: "ws-prod-01"
    ip: "192.168.1.30"
  - id: "vm-ws-02"
    hostname: "ws-prod-02"
    ip: "192.168.1.31"

  # Orchestration Agents (oa)
  - id: "vm-oa-01"
    hostname: "oa-prod-01"
    ip: "192.168.1.40"
  - id: "vm-oa-02"
    hostname: "oa-prod-02"
    ip: "192.168.1.41"
